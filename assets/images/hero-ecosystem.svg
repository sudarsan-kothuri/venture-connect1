<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="coreGrad" x1="300" y1="200" x2="500" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardBgGrad" x1="0" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="100" y1="100" x2="700" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="centralGlow" cx="400" cy="300" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="400" cy="300" r="260" fill="url(#centralGlow)" />

  <!-- Orbital Rings -->
  <ellipse cx="400" cy="300" rx="330" ry="190" stroke="url(#orbitGrad)" stroke-width="1.5" stroke-dasharray="6 8" />
  <ellipse cx="400" cy="300" rx="230" ry="130" stroke="url(#orbitGrad)" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.8" />
  <ellipse cx="400" cy="300" rx="140" ry="80" stroke="url(#orbitGrad)" stroke-width="1" stroke-dasharray="3 5" opacity="0.6" />

  <!-- Interconnecting Connection Beams -->
  <!-- Center to Founders (Top Left) -->
  <path d="M 400 300 Q 280 230 180 180" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="5 5" />
  <!-- Center to Investors (Top Right) -->
  <path d="M 400 300 Q 520 220 620 170" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="5 5" />
  <!-- Center to Incubators (Bottom Left) -->
  <path d="M 400 300 Q 270 380 160 420" stroke="#34d399" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="5 5" />
  <!-- Center to Hackathons (Bottom Right) -->
  <path d="M 400 300 Q 530 380 640 430" stroke="#f472b6" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="5 5" />
  <!-- Center to Universities (Bottom Center) -->
  <path d="M 400 300 L 400 480" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="5 5" />

  <!-- CENTRAL HUB: VENTURE CONNECT CORE -->
  <g transform="translate(400, 300)">
    <!-- Pulse ring -->
    <circle cx="0" cy="0" r="72" fill="#38bdf8" fill-opacity="0.08" />
    <circle cx="0" cy="0" r="60" fill="#6366f1" fill-opacity="0.15" />
    <circle cx="0" cy="0" r="48" fill="url(#coreGrad)" filter="url(#softGlow)" />
    <!-- Core Icon: Intersecting Nodes -->
    <path d="M -16 -12 L 0 20 L 16 -12" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-16" cy="-12" r="3.5" fill="#ffffff" />
    <circle cx="16" cy="-12" r="3.5" fill="#ffffff" />
    <circle cx="0" cy="20" r="4" fill="#ffffff" />
    <circle cx="0" cy="-2" r="2.5" fill="#38bdf8" />
    <!-- Label -->
    <text x="0" y="38" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">VENTURE CONNECT</text>
    <text x="0" y="50" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500">ECOSYSTEM CORE</text>
  </g>

  <!-- NODE 1: FOUNDERS & STARTUP IDEAS (Top-Left) -->
  <g transform="translate(110, 120)" filter="url(#badgeShadow)">
    <rect width="170" height="92" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    <!-- Icon Circle -->
    <circle cx="36" cy="46" r="20" fill="#0284c7" fill-opacity="0.2" />
    <path d="M 36 34 C 31 34 27 38 27 43 C 27 46 29 48 31 50 L 31 53 L 41 53 L 41 50 C 43 48 45 46 45 43 C 45 38 41 34 36 34 Z M 33 55 L 39 55 M 34 57 L 38 57" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Details -->
    <text x="68" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Startup Founders</text>
    <text x="68" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Showcase Innovations</text>
    <!-- Badge Tag -->
    <rect x="68" y="62" width="88" height="18" rx="9" fill="#0284c7" fill-opacity="0.2" />
    <circle cx="76" cy="71" r="3" fill="#38bdf8" />
    <text x="84" y="74" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">500+ Ideas</text>
  </g>

  <!-- NODE 2: INVESTORS & VCS (Top-Right) -->
  <g transform="translate(520, 110)" filter="url(#badgeShadow)">
    <rect width="180" height="92" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.7" />
    <circle cx="36" cy="46" r="20" fill="#4f46e5" fill-opacity="0.2" />
    <!-- Trending Growth Chart Icon -->
    <path d="M 27 54 L 33 46 L 39 49 L 45 38 M 41 38 L 45 38 L 45 42" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Investors & VCs</text>
    <text x="68" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Deal Flow & Evaluation</text>
    <!-- Badge Tag -->
    <rect x="68" y="62" width="96" height="18" rx="9" fill="#4f46e5" fill-opacity="0.2" />
    <circle cx="76" cy="71" r="3" fill="#818cf8" />
    <text x="84" y="74" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9" font-weight="600">120+ Angels & VCs</text>
  </g>

  <!-- NODE 3: INCUBATORS & ACCELERATORS (Bottom-Left) -->
  <g transform="translate(90, 380)" filter="url(#badgeShadow)">
    <rect width="185" height="92" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.7" />
    <circle cx="36" cy="46" r="20" fill="#059669" fill-opacity="0.2" />
    <!-- Seedling / Growth Icon -->
    <path d="M 36 55 L 36 43 M 36 43 C 36 37 43 36 45 36 C 45 42 41 45 36 45 C 32 45 28 41 28 37 C 32 37 36 40 36 43" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Incubators & Hubs</text>
    <text x="68" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Mentorship & Acceleration</text>
    <!-- Badge Tag -->
    <rect x="68" y="62" width="102" height="18" rx="9" fill="#059669" fill-opacity="0.2" />
    <circle cx="76" cy="71" r="3" fill="#34d399" />
    <text x="84" y="74" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Growth Programs</text>
  </g>

  <!-- NODE 4: HACKATHONS & COMPETITIONS (Bottom-Right) -->
  <g transform="translate(530, 390)" filter="url(#badgeShadow)">
    <rect width="180" height="92" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.7" />
    <circle cx="36" cy="46" r="20" fill="#db2777" fill-opacity="0.2" />
    <!-- Trophy Icon -->
    <path d="M 29 36 L 43 36 L 41 47 C 41 50 37 52 36 52 C 35 52 31 50 31 47 Z M 36 52 L 36 56 M 32 56 L 40 56 M 29 38 L 26 38 C 25 38 24 41 25 43 L 30 44 M 43 38 L 46 38 C 47 38 48 41 47 43 L 42 44" stroke="#f472b6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Hackathons Hub</text>
    <text x="68" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Innovation Challenges</text>
    <!-- Badge Tag -->
    <rect x="68" y="62" width="98" height="18" rx="9" fill="#db2777" fill-opacity="0.2" />
    <circle cx="76" cy="71" r="3" fill="#f472b6" />
    <text x="84" y="74" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">45+ Challenges</text>
  </g>

  <!-- NODE 5: COLLEGES & UNIVERSITIES (Bottom Center) -->
  <g transform="translate(305, 490)" filter="url(#badgeShadow)">
    <rect width="190" height="74" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#fbbf24" stroke-width="1.3" stroke-opacity="0.7" />
    <circle cx="30" cy="37" r="17" fill="#d97706" fill-opacity="0.2" />
    <!-- Graduation Cap -->
    <path d="M 19 33 L 30 28 L 41 33 L 30 38 Z M 24 36 L 24 42 C 24 44 27 46 30 46 C 33 46 36 44 36 42 L 36 36 M 41 34 L 41 43" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="56" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Colleges & Universities</text>
    <text x="56" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Student Entrepreneurship Cells</text>
  </g>

  <!-- FLOATING LIVE METRIC PILL 1 (Top Left) -->
  <g transform="translate(30, 40)" filter="url(#badgeShadow)">
    <rect width="210" height="38" rx="19" fill="#1e293b" fill-opacity="0.9" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#10b981" />
    <circle cx="20" cy="19" r="2.5" fill="#ffffff" />
    <text x="34" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Active Ecosystem Match</text>
    <text x="175" y="23" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">98%</text>
  </g>

  <!-- FLOATING LIVE METRIC PILL 2 (Top Right) -->
  <g transform="translate(560, 30)" filter="url(#badgeShadow)">
    <rect width="205" height="38" rx="19" fill="#1e293b" fill-opacity="0.9" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#818cf8" />
    <circle cx="20" cy="19" r="2.5" fill="#ffffff" />
    <text x="34" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Seed Pipeline Value</text>
    <text x="156" y="23" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="700">$12M+</text>
  </g>
</svg>
