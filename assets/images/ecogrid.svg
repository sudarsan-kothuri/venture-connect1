<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="ecoBg" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="solarGrad" x1="100" y1="120" x2="280" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="ecoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="600" height="400" rx="20" fill="url(#ecoBg)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" />

  <!-- Background decorative grid lines -->
  <path d="M 50 100 H 550 M 50 200 H 550 M 50 300 H 550" stroke="#10b981" stroke-opacity="0.1" stroke-dasharray="4 8" />
  <path d="M 150 50 V 350 M 300 50 V 350 M 450 50 V 350" stroke="#10b981" stroke-opacity="0.1" stroke-dasharray="4 8" />

  <!-- Smart Solar Panel Matrix (Isometric perspective) -->
  <g transform="translate(80, 130)">
    <!-- Base plate -->
    <polygon points="40,110 160,50 240,90 120,150" fill="url(#solarGrad)" stroke="#60a5fa" stroke-width="2" />
    <!-- Panel grid cells -->
    <line x1="80" y1="130" x2="200" y2="70" stroke="#93c5fd" stroke-width="1.5" />
    <line x1="100" y1="90" x2="180" y2="130" stroke="#93c5fd" stroke-width="1.5" />
    <line x1="140" y1="70" x2="220" y2="110" stroke="#93c5fd" stroke-width="1.5" />
    <!-- Support pole -->
    <line x1="130" y1="145" x2="130" y2="190" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="130" cy="190" rx="16" ry="6" fill="#334155" />
    <!-- Energy emission beam -->
    <path d="M 160 50 Q 210 20 280 40" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 4" filter="url(#ecoGlow)" />
  </g>

  <!-- Central IoT Smart Gateway & Sensor Hub -->
  <g transform="translate(320, 110)">
    <!-- Dashboard Card Mockup -->
    <rect width="210" height="150" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <!-- Header -->
    <rect width="210" height="30" rx="12" fill="#1e293b" fill-opacity="0.8" />
    <circle cx="20" cy="15" r="4" fill="#ef4444" />
    <circle cx="34" cy="15" r="4" fill="#f59e0b" />
    <circle cx="48" cy="15" r="4" fill="#10b981" />
    <text x="80" y="19" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">EcoGrid Telemetry</text>
    
    <!-- Real-time Sparkline Graph -->
    <path d="M 20 105 L 55 85 L 85 95 L 120 60 L 155 75 L 190 48" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#ecoGlow)" />
    <!-- Area gradient under graph -->
    <polygon points="20,105 55,85 85,95 120,60 155,75 190,48 190,120 20,120" fill="url(#gridGrad)" fill-opacity="0.1" />

    <!-- Stat labels -->
    <text x="22" y="138" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Efficiency Gain</text>
    <text x="145" y="138" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700">+34.8%</text>
  </g>

  <!-- EcoGrid Identity Badge -->
  <g transform="translate(50, 45)">
    <rect width="230" height="42" rx="10" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1" />
    <!-- Leaf / Power Icon -->
    <circle cx="22" cy="21" r="12" fill="#10b981" fill-opacity="0.2" />
    <path d="M 22 13 C 27 13 30 17 30 22 C 30 27 26 29 22 29 C 18 29 14 27 14 22 C 14 17 18 13 22 13 Z M 22 21 L 22 29" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
    <text x="44" y="21" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">EcoGrid Systems</text>
    <text x="44" y="33" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500">CleanTech • Smart Energy AI</text>
  </g>

  <!-- Problem / Solution Callout Pills -->
  <g transform="translate(60, 310)">
    <rect width="210" height="48" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="20" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="700">PROBLEM STATEMENT</text>
    <text x="14" y="36" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Energy waste in legacy grid distribution</text>
  </g>

  <g transform="translate(310, 310)">
    <rect width="230" height="48" rx="8" fill="#1e293b" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="20" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">VENTURE CONNECT IMPACT</text>
    <text x="14" y="36" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Hackathon win → CleanTech VC syndicate</text>
  </g>
</svg>
